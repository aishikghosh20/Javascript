<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="myh1">STOPWATCH</h1>
    <br>
    <div id="container">
        <div id="display">
            00:00:00:00
        </div>
        <div id="controls">
            <button class="buttons" id="startbtn" onclick="start()">Start</button>
            <button class="buttons" id="stopbtn" onclick="stop()">Stop</button>
            <button class="buttons" id="resetbtn" onclick="reset()">Reset</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
