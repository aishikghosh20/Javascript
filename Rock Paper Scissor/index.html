<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="header">Rock-Paper-Scissor</h1>
    <div id="choice">
    <button class="choices" id="Rock" onclick="playGame('rock')">👊</button>
    <button class="choices" id="Paper" onclick="playGame('paper')">🖐️</button>
    <button class="choices" id="Scissors" onclick="playGame('scissors')">✌️</button>
    </div>

    <div id="playerdisplay">PLAYER: </div>
    <div id="compdisplay">COMPUTER: </div>
    <div id="result">Result</div>

    <div class="scoredisplay">Player Score:
        <span id="playerscoredisplay">0</span>
    </div>
    <div class="scoredisplay">Computer Score:
        <span id="computerscoredisplay">0</span>
    </div>

    <script src="index.js"></script>
</body>
</html>
